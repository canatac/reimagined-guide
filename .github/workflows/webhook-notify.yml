name: Webhook Notification on PR Merge

on:
  pull_request:
    types: [closed]
    branches: [master]

jobs:
  notify-webhook:
    name: Send Webhook on PR Merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Send webhook notification
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_NOTIFY_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_NOTIFY_SECRET }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "WEBHOOK_NOTIFY_URL not set — skipping notification"
            exit 0
          fi

          # Build payload
          PAYLOAD=$(cat <<EOF
          {
            "event": "pr_merged",
            "pr_number": ${{ github.event.pull_request.number }},
            "pr_title": "${{ github.event.pull_request.title }}",
            "pr_url": "${{ github.event.pull_request.html_url }}",
            "merged_by": "${{ github.event.pull_request.merged_by.login }}",
            "repository": "${{ github.repository }}",
            "branch": "${{ github.event.pull_request.base.ref }}",
            "commit_sha": "${{ github.event.pull_request.merge_commit_sha }}",
            "timestamp": "${{ github.event.pull_request.merged_at }}"
          }
          EOF
          )

          # Compute HMAC signature if secret is set
          if [ -n "$WEBHOOK_SECRET" ]; then
            SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')
            HEADER="X-Signature-256: sha256=$SIGNATURE"
          else
            HEADER=""
          fi

          echo "Sending webhook notification for PR #${{ github.event.pull_request.number }}"
          echo "Payload: $PAYLOAD"

          HTTP_CODE=$(curl -s -o /tmp/webhook_response.txt -w "%{http_code}" \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "User-Agent: misfits.ai-webhook/1.0" \
            -H "X-GitHub-Event: pull_request" \
            ${HEADER:+"$HEADER"} \
            -d "$PAYLOAD")

          echo "Webhook response code: $HTTP_CODE"
          echo "Webhook response body: $(cat /tmp/webhook_response.txt)"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "WARNING: Webhook returned non-2xx status code: $HTTP_CODE"
          fi
