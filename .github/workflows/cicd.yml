name: CI/CD Pipeline - SMTP Rust + DKIM (Scaleway Container Registry -> Scaleway VM)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  repository_dispatch:
    types: [deploy]

env:
  SCW_REGISTRY_ENDPOINT: ${{ secrets.SCW_REGISTRY_ENDPOINT }}
  VM_IP: ${{ secrets.VM_IP }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}

jobs:
  # ============================================================
  # JOB 1 : Test - Compilation Rust (cargo check)
  # ============================================================
  test:
    name: Compile & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo check (lib + bins)
        run: cargo check --lib --bins --verbose

  # ============================================================
  # JOB 2 : Build & Push SMTP image via Docker Buildx to SCW Registry
  #          SKIPPED on repository_dispatch (DKIM-only change)
  # ============================================================
  build-push-smtp:
    name: Build & Push SMTP image (SCW Registry)
    needs: test
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
      || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.SCW_REGISTRY_ENDPOINT }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build & push SMTP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.SCW_REGISTRY_ENDPOINT }}/smtp-server:latest
            ${{ secrets.SCW_REGISTRY_ENDPOINT }}/smtp-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # JOB 3 : Déploiement sur la VM Scaleway
  #          - charge les secrets depuis 1Password
  #          - SSH -> pull des deux images (SMTP + DKIM) depuis SCW Registry
  #          - docker-compose up -d
  # ============================================================
  deploy:
    name: Deploy to Scaleway VM
    needs: [test, build-push-smtp]
    runs-on: ubuntu-latest
    if: >-
      always() &&
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'repository_dispatch'
    steps:
      - uses: actions/checkout@v4

      # --- Charger les secrets depuis 1Password ---
      - name: Configure 1Password service account
        uses: 1password/load-secrets-action/configure@v2
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          # SSH key from 1Password (SSH key item with dedicated fields)
          VM_SSH_KEY: op://hermes/ssh-hermes-smtp/private-key

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ env.VM_SSH_KEY }}
          known_hosts: ${{ secrets.VM_KNOWN_HOSTS }}

      - name: Copy docker-compose.deploy.yml to VM
        run: |
          scp -o StrictHostKeyChecking=no \
            docker-compose.deploy.yml \
            debian@${{ secrets.VM_IP }}:/home/debian/docker-compose.deploy.yml

      - name: Pull images & deploy
        run: |
          ssh -o StrictHostKeyChecking=no debian@${{ secrets.VM_IP }} << 'REMOTE'
            set -euo pipefail
            cd /home/debian

            # Clean up old images to free disk space (VM has limited storage)
            sudo docker system prune -af --filter "until=1h" 2>/dev/null || true

            # Login to Scaleway Container Registry on the VM
            echo "${{ secrets.SCW_SECRET_KEY }}" | sudo docker login \
              ${{ secrets.SCW_REGISTRY_ENDPOINT }} \
              -u nologin --password-stdin

            # Pull latest images from Scaleway Container Registry
            sudo docker pull ${{ secrets.SCW_REGISTRY_ENDPOINT }}/smtp-server:latest
            sudo docker pull ${{ secrets.SCW_REGISTRY_ENDPOINT }}/dkim-service:latest

            # Remove stale containers that conflict with compose names
            sudo docker rm -f email-api smtp-server imap-server misfits-web dkim-service 2>/dev/null || true

            # Deploy with unified compose
            # Create .env.deploy if it doesn't exist with default values
            if [ ! -f .env.deploy ]; then
              echo "Creating .env.deploy with default values..."
              printf 'SCW_REGISTRY_ENDPOINT=%s\nMONGODB_USERNAME=mongo\nMONGODB_PASSWORD=change...o\n' "${{ secrets.SCW_REGISTRY_ENDPOINT }}" > .env.deploy
            fi
            # Drop stale Docker bind dirs created when file sources were missing
            # (docker turns missing file mounts into empty directories → OCI mount error)
            sudo rm -rf /home/debian/runtime-patches 2>/dev/null || true

            sudo docker compose -f docker-compose.deploy.yml --env-file .env.deploy up -d --force-recreate --remove-orphans

            # Wait for misfits-web, then hot-patch baked Next rewrites if still
            # pointing at imap-server:8080 (old image). BACKEND_URL env is not
            # enough — rewrites are baked into server.js / routes-manifest.
            sleep 5
            if sudo docker ps --format '{{.Names}}' | grep -qx misfits-web; then
              sudo docker exec -u 0 misfits-web sh -c '
                set -e
                for f in /app/server.js \
                         /app/.next/required-server-files.json \
                         /app/.next/routes-manifest.json; do
                  if [ -f "$f" ] && grep -q "imap-server:8080" "$f" 2>/dev/null; then
                    sed -i "s|http://imap-server:8080|http://email-api:8000|g" "$f"
                    echo "patched $f"
                  fi
                done
              '
              sudo docker restart misfits-web
              sleep 3
            fi

            # Wait & check containers
            sudo docker compose -f docker-compose.deploy.yml ps
          REMOTE

      - name: Smoke test - SMTP port 587 (STARTTLS)
        run: |
          ssh -o StrictHostKeyChecking=no debian@${{ secrets.VM_IP }} \
            "for i in \$(seq 1 12); do if nc -z -w 3 127.0.0.1 587 2>/dev/null; then echo 'SMTP port 587 open' && exit 0; fi; echo \"retry \$i...\"; sleep 5; done; echo 'SMTP port 587 not reachable'; exit 1"

      - name: Smoke test - DKIM service port 3000
        run: |
          ssh -o StrictHostKeyChecking=no debian@${{ secrets.VM_IP }} \
            "for i in \$(seq 1 12); do if curl -sf http://127.0.0.1:3000/health 2>/dev/null | grep -q 'ok'; then echo 'DKIM health check OK' && exit 0; fi; echo \"retry \$i...\"; sleep 5; done; echo 'DKIM service not reachable on :3000'; exit 1"
