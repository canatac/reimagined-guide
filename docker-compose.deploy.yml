# docker-compose.deploy.yml
# Déploiement unifié sur la VM Scaleway
# 5 services : smtp-server, email-api, imap-server, dkim-service, misfits-web
# MongoDB est installé nativement sur la VM (pas dans un container)
# Images pulled from Scaleway Container Registry
#
# Usage sur la VM :
#   docker compose -f docker-compose.deploy.yml --env-file .env.deploy up -d

services:
  smtp-server:
    image: ${SCW_REGISTRY_ENDPOINT}/smtp-server:latest
    container_name: smtp-server
    restart: always
    ports:
      - "25:8025"
      - "587:8465"
      - "8025:8025"
      - "8465:8465"
    volumes:
      - ./emails:/app/emails
      - ./certs:/app/certs
      - ./dkim:/app/dkim
    environment:
      - SMTP_TLS_ADDR=${SMTP_TLS_ADDR}
      - SMTP_PLAIN_ADDR=${SMTP_PLAIN_ADDR}
      - CERT_PATH=/app/certs/${CERT_PATH}
      - KEY_PATH=/app/certs/${KEY_PATH}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - MONGODB_USERNAME=${MONGODB_USERNAME}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD}
      - MONGODB_CLUSTER_URL=172.16.12.2:27017
      - MONGODB_APP_NAME=${MONGODB_APP_NAME:-mailserver}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-mailserver}
      - MONGODB_COLLECTION=${MONGODB_COLLECTION:-emails}
      - USE_MONGODB=${USE_MONGODB:-true}
      - RUST_LOG=${RUST_LOG:-info}
    command: ["smtp_server"]
    networks:
      - mailnet

  email-api:
    image: ${SCW_REGISTRY_ENDPOINT}/smtp-server:latest
    container_name: email-api
    restart: always
    ports:
      - "8000:8000"
      - "8443:8443"
    volumes:
      - ./certs:/app/certs
    environment:
      - API_SERVER_ADDR=${API_SERVER_ADDR}
      - FULLCHAIN_PATH=/app/certs/${FULLCHAIN_PATH}
      - PRIVKEY_PATH=/app/certs/${PRIVKEY_PATH}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - MONGODB_USERNAME=${MONGODB_USERNAME}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD}
      - MONGODB_CLUSTER_URL=172.16.12.2:27017
      - MONGODB_APP_NAME=${MONGODB_APP_NAME:-mailserver}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-mailserver}
      - MONGODB_COLLECTION=${MONGODB_COLLECTION:-emails}
      - USE_MONGODB=${USE_MONGODB:-true}
      - DKIM_SERVICE_URL=http://dkim-service:3000/sign
      - RUST_LOG=${RUST_LOG:-info}
    command: ["email_api"]
    # Image HEALTHCHECK probes :8025 (SMTP). Override for API binary.
    # wget --spider treats some 2xx oddly; use full GET + HTTP code check.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/api/emails || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      - smtp-server
    networks:
      - mailnet

  imap-server:
    image: ${SCW_REGISTRY_ENDPOINT}/smtp-server:latest
    container_name: imap-server
    restart: always
    ports:
      - "143:143"
      - "993:993"
      - "8080:8080"
    volumes:
      - ./emails:/app/emails
    environment:
      - IMAP_SERVER=${IMAP_SERVER}
      - IMAP_SERVER_API_PORT=${IMAP_SERVER_API_PORT}
      - MONGODB_USERNAME=${MONGODB_USERNAME}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD}
      - MONGODB_CLUSTER_URL=172.16.12.2:27017
      - MONGODB_APP_NAME=${MONGODB_APP_NAME:-mailserver}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-mailserver}
      - MONGODB_COLLECTION=${MONGODB_COLLECTION:-emails}
      - USE_MONGODB=${USE_MONGODB:-true}
      - RUST_LOG=${RUST_LOG:-info}
    command: ["imap_server"]
    # Image HEALTHCHECK is SMTP-specific; slim image has no pgrep — probe PID1.
    healthcheck:
      test: ["CMD-SHELL", "test -d /proc/1 && grep -q imap_server /proc/1/comm"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - mailnet

  dkim-service:
    image: ${SCW_REGISTRY_ENDPOINT}/dkim-service:latest
    container_name: dkim-service
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./dkim:/app/dkim
    environment:
      - PORT=3000
      - SMTP_HOST=smtp-server
      - SMTP_PORT=8025
      - SMTP_SECURE=false
      - SMTP_USER=${SMTP_USERNAME}
      - SMTP_PASS=${SMTP_PASSWORD}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - KEY_SELECTOR=${KEY_SELECTOR:-default}
      - PRIVATE_KEY_PATH=dkim/dkim-private.pem
    depends_on:
      - smtp-server
    networks:
      - mailnet

  # ----------------------------------------------------------
  # Frontend (Next.js 15) - misfits.ai Mail
  # ----------------------------------------------------------
  misfits-web:
    image: ${SCW_REGISTRY_ENDPOINT}/misfits-web:latest
    container_name: misfits-web
    restart: always
    ports:
      - "3001:3000"
    # Next rewrites bake BACKEND_URL at image build time. Until image rebuild,
    # overlay patched server.js + manifests (imap-server:8080 → email-api:8000).
    volumes:
      - ./runtime-patches/misfits-web/server.js:/app/server.js:ro
      - ./runtime-patches/misfits-web/.next/required-server-files.json:/app/.next/required-server-files.json:ro
      - ./runtime-patches/misfits-web/.next/routes-manifest.json:/app/.next/routes-manifest.json:ro
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Proxy Next /api/* → email_api HTTP (not imap :8080 — no HTTP there)
      - BACKEND_URL=http://email-api:8000
    depends_on:
      - email-api
    networks:
      - mailnet

networks:
  mailnet:
    driver: bridge