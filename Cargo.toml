[package]
name = "simple-smtp-server"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
actix-multipart = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
bson = "2"
mongodb = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
data-encoding = "2"
base64 = "0.22"
urlencoding = "2"
reqwest = { version = "0.12", features = ["json"] }
lettre = { version = "0.11", features = ["smtp-transport", "builder"] }
rand = "0.8"
lazy_static = "1"
bcrypt = "0.15"
constant_time_eq = "0.3.1"
subtle = "2"
regex = "1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = "0.14"
dotenv = "0.15"
anyhow = "1"
thiserror = "1"
