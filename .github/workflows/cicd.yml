name: CI/CD Pipeline - SMTP Rust + DKIM (Scaleway Container Registry -> Scaleway VM)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  repository_dispatch:
    types: [deploy]

env:
  SCW_REGISTRY_ENDPOINT: ${{ secrets.SCW_REGISTRY_ENDPOINT }}
  VM_IP: ${{ secrets.VM_IP }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
  GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}

jobs:
  # ============================================================
  # JOB 1 : Test - Compilation Rust (cargo check)
  # ============================================================
  test:
    name: Compile & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo check (lib + bins)
        run: cargo check --lib --bins --verbose

  # ============================================================
  # JOB 2 : Build & Push SMTP image via Docker Buildx to SCW Registry
  #          SKIPPED on repository_dispatch (DKIM-only change)
  # ============================================================
  build-push-smtp:
    name: Build & Push SMTP image (SCW Registry)
    needs: test
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
      || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.SCW_REGISTRY_ENDPOINT }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build & push SMTP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.SCW_REGISTRY_ENDPOINT }}/smtp-server:latest
            ${{ secrets.SCW_REGISTRY_ENDPOINT }}/smtp-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # JOB 3 : Déploiement sur la VM Scaleway
  #          - charge les secrets depuis 1Password
  #          - SSH -> pull des deux images (SMTP + DKIM) depuis SCW Registry
  #          - docker-compose up -d
  # ============================================================
  deploy:
    name: Deploy to Scaleway VM
    needs: [test, build-push-smtp]
    runs-on: ubuntu-latest
    if: >-
      always() &&
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'repository_dispatch'
    steps:
      - uses: actions/checkout@v4

      # --- Charger les secrets depuis 1Password ---
      - name: Configure 1Password service account
        uses: 1password/load-secrets-action/configure@v2
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          VM_SSH_KEY: op://hermes/ssh-hermes-smtp/private-key
          DEPLOY_ENV_CONTENT: op://hermes/scw-hermes-smtp/texte

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ env.VM_SSH_KEY }}
          known_hosts: ${{ secrets.VM_KNOWN_HOSTS }}

      - name: Copy docker-compose.deploy.yml to VM
        run: |
          scp -o StrictHostKeyChecking=no \
            docker-compose.deploy.yml \
            debian@${{ secrets.VM_IP }}:/home/debian/docker-compose.deploy.yml

      - name: Copy Caddyfile to VM
        run: |
          scp -o StrictHostKeyChecking=no \
            Caddyfile \
            debian@${{ secrets.VM_IP }}:/home/debian/Caddyfile

      - name: Write .env.deploy to VM
        env:
          DEPLOY_ENV_CONTENT: ${{ env.DEPLOY_ENV_CONTENT }}
        run: |
          # Write 1Password content locally on the runner first (avoids SSH escaping issues)
          printf '%s\n' "$DEPLOY_ENV_CONTENT" > /tmp/.env.deploy

          # Inject the 3 secrets that only exist in GitHub Secrets (not in 1Password)
          upsert_env() {
            local key="$1" val="$2" file="/tmp/.env.deploy"
            if grep -q "^${key}=" "$file" 2>/dev/null; then
              sed -i "s|^${key}=.*|${key}=${val}|" "$file"
            else
              echo "${key}=${val}" >> "$file"
            fi
          }
          upsert_env GITHUB_CLIENT_ID     "${{ secrets.OAUTH_GITHUB_CLIENT_ID }}"
          upsert_env GITHUB_CLIENT_SECRET "${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}"
          upsert_env SCW_REGISTRY_ENDPOINT "${{ secrets.SCW_REGISTRY_ENDPOINT }}"
          upsert_env OAUTH_CALLBACK_BASE_URL "https://mail.misfits.ai"
          upsert_env FRONTEND_BASE_URL       "https://mail.misfits.ai"

          echo "Lines in .env.deploy: $(wc -l < /tmp/.env.deploy)"

          # Copy to VM via scp (reliable binary transfer, no shell escaping)
          scp -o StrictHostKeyChecking=no /tmp/.env.deploy \
            debian@${{ secrets.VM_IP }}:/home/debian/.env.deploy

      - name: Diagnose .env.deploy on VM
        run: |
          ssh -o StrictHostKeyChecking=no debian@${{ secrets.VM_IP }} bash << 'REMOTE'
            echo "=== .env.deploy diagnostics ==="
            if [ ! -f /home/debian/.env.deploy ]; then
              echo "ERROR: /home/debian/.env.deploy does not exist!"
              exit 1
            fi
            echo "File size: $(wc -c < /home/debian/.env.deploy) bytes"
            echo "Line count: $(wc -l < /home/debian/.env.deploy)"
            echo "=== Keys present (values hidden) ==="
            grep -v '^#' /home/debian/.env.deploy | grep '=' | cut -d'=' -f1 | sort
            echo "=== Keys with EMPTY values ==="
            grep -v '^#' /home/debian/.env.deploy | grep '^[^=]*=$' | cut -d'=' -f1 || echo "(none)"
          REMOTE

      - name: Pull images & deploy
        env:
          INJECT_SCW_REGISTRY_ENDPOINT: ${{ secrets.SCW_REGISTRY_ENDPOINT }}
          INJECT_SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          ssh -o StrictHostKeyChecking=no debian@${{ secrets.VM_IP }} \
            INJECT_SCW_REGISTRY_ENDPOINT="$INJECT_SCW_REGISTRY_ENDPOINT" \
            INJECT_SCW_SECRET_KEY="$INJECT_SCW_SECRET_KEY" \
            bash << 'REMOTE'
            set -euo pipefail
            cd /home/debian

            # Clean up old images to free disk space (VM has limited storage)
            sudo docker system prune -af --filter "until=1h" 2>/dev/null || true

            # Login to Scaleway Container Registry on the VM
            echo "$INJECT_SCW_SECRET_KEY" | sudo docker login \
              "$INJECT_SCW_REGISTRY_ENDPOINT" \
              -u nologin --password-stdin

            # Pull latest images from Scaleway Container Registry
            sudo docker pull "$INJECT_SCW_REGISTRY_ENDPOINT/smtp-server:latest"
            sudo docker pull "$INJECT_SCW_REGISTRY_ENDPOINT/dkim-service:latest"

            # Remove stale containers that conflict with compose names
            sudo docker rm -f email-api smtp-server imap-server misfits-web dkim-service caddy 2>/dev/null || true

            # Stop any running compose stack to release bound ports (e.g. :80/:443)
            sudo docker compose -f /home/debian/docker-compose.deploy.yml down --remove-orphans 2>/dev/null || true

            # Drop stale Docker bind dirs
            sudo rm -rf /home/debian/runtime-patches 2>/dev/null || true

            # ── Free ports used by compose services ──────────────────────────────────────
            # Stop known system services that may hold ports before Docker tries to bind them.
            for svc in nginx apache2 caddy haproxy lighttpd; do
              if systemctl is-active --quiet "$svc" 2>/dev/null; then
                echo "Stopping system service: $svc"
                sudo systemctl stop "$svc" || true
                sudo systemctl disable "$svc" || true
              fi
            done

            # Kill any remaining process still listening on the ports we need.
            PORTS="80 443 25 587 8025 8465 143 993 8000 8443 3000 3001 8080"
            if command -v fuser &>/dev/null; then
              for port in $PORTS; do
                sudo fuser -k "${port}/tcp" 2>/dev/null || true
              done
            else
              # fallback: ss + kill
              for port in $PORTS; do
                pids=$(sudo ss -tlnp "sport = :${port}" 2>/dev/null \
                       | grep -oP 'pid=\K[0-9]+' | sort -u || true)
                for pid in $pids; do
                  echo "Killing pid $pid on port $port"
                  sudo kill -9 "$pid" 2>/dev/null || true
                done
              done
            fi
            # Brief pause to let the OS release sockets
            sleep 2
            # ─────────────────────────────────────────────────────────────────────────────

            if [ ! -f .env.deploy ]; then
              echo ".env.deploy is missing; aborting deployment."
              exit 1
            fi

            sudo docker compose -f /home/debian/docker-compose.deploy.yml --env-file /home/debian/.env.deploy up -d --force-recreate --remove-orphans

            # Wait for misfits-web, then hot-patch baked Next rewrites if still
            # pointing at imap-server:8080 (old image). BACKEND_URL env is not
            # enough — rewrites are baked into server.js / routes-manifest.
            sleep 5
            if sudo docker ps --format '{{.Names}}' | grep -qx misfits-web; then
              sudo docker exec -u 0 misfits-web sh -c '
                set -e
                for f in /app/server.js \
                         /app/.next/required-server-files.json \
                         /app/.next/routes-manifest.json; do
                  if [ -f "$f" ] && grep -q "imap-server:8080" "$f" 2>/dev/null; then
                    sed -i "s|http://imap-server:8080|http://email-api:8000|g" "$f"
                    echo "patched $f"
                  fi
                done
              '
              sudo docker restart misfits-web
              sleep 3
            fi

            # Wait & check containers
            sudo docker compose -f /home/debian/docker-compose.deploy.yml ps
          REMOTE

      - name: Smoke test - SMTP port 587 (STARTTLS)
        run: |
          ssh -o StrictHostKeyChecking=no debian@${{ secrets.VM_IP }} \
            "for i in \$(seq 1 12); do if nc -z -w 3 127.0.0.1 587 2>/dev/null; then echo 'SMTP port 587 open' && exit 0; fi; echo \"retry \$i...\"; sleep 5; done; echo 'SMTP port 587 not reachable'; exit 1"

      - name: Smoke test - DKIM service port 3000
        run: |
          ssh -o StrictHostKeyChecking=no debian@${{ secrets.VM_IP }} \
            "for i in \$(seq 1 12); do if curl -sf http://127.0.0.1:3000/health 2>/dev/null | grep -q 'ok'; then echo 'DKIM health check OK' && exit 0; fi; echo \"retry \$i...\"; sleep 5; done; echo 'DKIM service not reachable on :3000'; exit 1"
