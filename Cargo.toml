[package]
name = "simple-smtp-server"
version = "0.2.0"
authors = ["Your Name <your.email@example.com>"]
edition = "2021"
autobins = false

[[bin]]
name = "smtp_server"
path = "src/bin/smtp_server.rs"

[[bin]]
name = "email_api"
path = "src/bin/email_api.rs"

[[bin]]
name = "imap_server"
path = "src/bin/imap_server.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[lib]
name = "simple_smtp_server"
path = "src/lib.rs"

[dependencies]
actix-web = { version = "4.11.0", features = ["openssl"] }
openssl = "0.10.66"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full", "tracing"] }
tokio-rustls = "0.26.0"
rustls = { version = "0.23.12", default-features = false, features = ["std", "aws-lc-rs"] }
webpki-roots = "1.0.9"
trust-dns-resolver = "0.23.2"
clap = "4.6.4"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
actix-cors = "0.7.0"
bcrypt = "0.15"

log = "0.4.33"
env_logger = "0.10"
rustls-native-certs = "0.8.4"

rustls-pemfile = "2.0.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.18"
console-subscriber = "0.1.10"
dotenv = "0.15.0"
base64 = "0.22.1"
mailparse = "0.15.0"
lettre = "0.11.8"
pem = "3.0.4"
tempfile = "3.13.0"
lazy_static = "1.4.0"
constant_time_eq = "0.3.1"
fluent = "0.16"
fluent-bundle = "0.15"
fluent-langneg = "0.13"
unic-langid = "0.9"

mongodb = "3.8.0"
futures-util = "0.3.31"
warp = "0.4.3"

chrono = { version = "0.4.38", features = ["serde"] }
async-trait = "0.1.83"
uuid = { version = "1.11.0", features = ["v4"] }
urlencoding = "2"

[dev-dependencies]
mockall = "0.11.0"
tokio = { version = "1", features = ["full", "test-util"] }