name: CI/CD Pipeline - SMTP Rust + DKIM (Azure ACR -> Scaleway VM)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  repository_dispatch:
    types: [deploy]

env:
  ACR_NAME: ${{ secrets.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  VM_IP: ${{ secrets.VM_IP }}

jobs:
  # ============================================================
  # JOB 1 : Test - Compilation Rust (cargo check)
  # ============================================================
  test:
    name: Compile & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo check (lib + bins)
        run: cargo check --lib --bins --verbose

  # ============================================================
  # JOB 2 : Build & Push SMTP image via az acr build
  #          SKIPPED on repository_dispatch (DKIM-only change)
  # ============================================================
  build-push-smtp:
    name: Build & Push SMTP image (az acr build)
    needs: test
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
      || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build & push SMTP image (remote ACR build, no local Docker)
        run: |
          set -euo pipefail
          az acr build \
            --image smtp-server:latest \
            --image smtp-server:${{ github.sha }} \
            --registry ${{ env.ACR_NAME }} \
            --file Dockerfile \
            .

  # ============================================================
  # JOB 3 : Déploiement sur la VM Scaleway
  #          - charge les secrets depuis 1Password
  #          - SSH -> pull des deux images (SMTP + DKIM) depuis ACR
  #          - docker-compose up -d
  # ============================================================
  deploy:
    name: Deploy to Scaleway VM
    needs: [test, build-push-smtp]
    runs-on: ubuntu-latest
    if: >-
      always() &&
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'repository_dispatch'
    steps:
      - uses: actions/checkout@v4

      # --- Charger les secrets depuis 1Password ---
      - name: Configure 1Password service account
        uses: 1password/load-secrets-action/configure@v2
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          # Format: ENV_VAR_NAME=op://<vault>/<item>/<field>
          # À adapter selon l'organisation du vault 1Password
          ACR_USERNAME: op://smtp-project/acr/username
          ACR_PASSWORD: op://smtp-project/acr/password
          VM_SSH_KEY: op://smtp-project/vm/ssh-private-key
          VM_KNOWN_HOSTS: op://smtp-project/vm/known-hosts

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ env.VM_SSH_KEY }}
          known_hosts: ${{ env.VM_KNOWN_HOSTS }}

      - name: Copy docker-compose.deploy.yml to VM
        run: |
          scp -o StrictHostKeyChecking=no \
            docker-compose.deploy.yml \
            ubuntu@${{ env.VM_IP }}:/home/ubuntu/docker-compose.deploy.yml

      - name: Pull images & deploy
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ env.VM_IP }} << 'REMOTE'
            set -euo pipefail
            cd /home/ubuntu

            # Login to Azure ACR on the VM
            echo "${{ env.ACR_PASSWORD }}" | docker login \
              ${{ env.ACR_LOGIN_SERVER }} \
              -u ${{ env.ACR_USERNAME }} --password-stdin

            # Pull latest images from Azure ACR
            docker pull ${{ env.ACR_LOGIN_SERVER }}/smtp-server:latest
            docker pull ${{ env.ACR_LOGIN_SERVER }}/dkim-service:latest

            # Deploy with unified compose
            docker compose -f docker-compose.deploy.yml --env-file .env.deploy up -d --remove-orphans

            # Wait & check containers
            sleep 5
            docker compose -f docker-compose.deploy.yml ps
          REMOTE

      - name: Smoke test - SMTP port 25
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if nc -z -w 3 ${{ env.VM_IP }} 25 2>/dev/null; then
              echo "SMTP port 25 open"
              exit 0
            fi
            echo "retry $i..."
            sleep 5
          done
          echo "SMTP port 25 not reachable"
          exit 1

      - name: Smoke test - DKIM service port 3000
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -sf http://${{ env.VM_IP }}:3000/health 2>/dev/null | grep -q "ok"; then
              echo "DKIM health check OK"
              exit 0
            fi
            echo "retry $i..."
            sleep 5
          done
          echo "DKIM service not reachable on :3000"
          exit 1
