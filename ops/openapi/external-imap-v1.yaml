openapi: 3.0.3
info:
  title: Misfits Mail External IMAP Aggregation API
  version: 1.0.0
servers:
  - url: https://mail.misfits.ai
  - url: http://127.0.0.1:8000
paths:
  /api/openapi/external-imap.yaml:
    get:
      summary: Get this OpenAPI specification
      responses:
        '200':
          description: OpenAPI YAML
          content:
            application/yaml:
              schema:
                type: string
  /api/external-accounts:
    get:
      summary: List external IMAP accounts
      responses:
        '200':
          description: External accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExternalImapAccount'
    post:
      summary: Create external IMAP account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExternalAccountInput'
      responses:
        '200':
          description: External account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalImapAccount'
  /api/external-accounts/oauth2/providers:
    get:
      summary: List OAuth2 providers for the account picker
      description: >
        Returns the providers the client may offer in the "Connect an external
        account" picker (Gmail, Outlook, Yahoo, Other). Each entry carries the
        provider key stored on the account, the display label, and the
        authorization/token endpoints the client needs to start the flow.
      responses:
        '200':
          description: Provider catalogue
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/OAuth2ProviderOption'
  /api/external-accounts/oauth2/start:
    get:
      summary: Start the OAuth2 consent flow from a chosen provider
      description: >
        Returns the provider consent URL in the body so a client can navigate
        to it directly. No external account needs to exist yet: the provider
        is chosen by the caller (gmail, outlook, yahoo, other).
      parameters:
        - in: query
          name: provider
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Authorization URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2AuthorizationUrl'
        '400':
          description: Unknown or unsupported provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/external-accounts/{id}:
    get:
      summary: Get external account
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: External account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalImapAccount'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update external account
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExternalAccountInput'
      responses:
        '200':
          description: External account updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalImapAccount'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete external account
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
        '404':
          $ref: '#/components/responses/NotFound'
  /api/external-accounts/{id}/test:
    post:
      summary: Test IMAP auth/capabilities
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: IMAP test result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImapTestResult'
        '422':
          description: IMAP auth failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/external-accounts/{id}/folders:
    get:
      summary: List external folders
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Folders
          content:
            application/json:
              schema:
                type: object
                properties:
                  folders:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExternalImapFolder'
  /api/external-accounts/{id}/folders/discover:
    post:
      summary: Discover folders from remote IMAP
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Discovery result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImapDiscoverResult'
  /api/external-accounts/{id}/folders/{folder_id}/mapping:
    put:
      summary: Set local role mapping for a folder
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: folder_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderMappingInput'
      responses:
        '200':
          description: Mapping updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalImapFolder'
  /api/external-accounts/{id}/sync:
    post:
      summary: Start a sync run
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sync started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalSyncRun'
  /api/external-accounts/{id}/sync/status:
    get:
      summary: Get sync status
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sync status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalSyncStatus'
  /api/external-accounts/{id}/sync/pause:
    post:
      summary: Pause sync
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Paused
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
  /api/external-accounts/{id}/sync/resume:
    post:
      summary: Resume sync
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
  /api/external-accounts/{id}/oauth2/start:
    get:
      summary: Get the provider authorization URL
      description: >
        Returns the provider consent URL in the body so a client that cannot
        follow a redirect can navigate to it directly.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Authorization URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2AuthorizationUrl'
        '400':
          description: Provider does not support OAuth2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/external-accounts/{id}/oauth2/callback:
    post:
      summary: Exchange the authorization code for tokens
      description: >
        Stores the returned refresh token encrypted at rest (AES-256-GCM).
        A revoked or expired code is reported as HTTP 401 with code
        OAUTH2_TOKEN_REVOKED.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuth2CallbackInput'
      responses:
        '200':
          description: Tokens stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  message: { type: string }
        '401':
          description: Code revoked or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/external-accounts/{id}/oauth2/tokens:
    post:
      summary: Manually update OAuth2 tokens (testing)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuth2TokenUpdateInput'
      responses:
        '200':
          description: Tokens updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  message: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'
  /api/external-accounts/{id}/oauth2/refresh:
    post:
      summary: Refresh an expired access token
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Tokens refreshed (or still valid)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  message: { type: string }
        '400':
          description: No refresh token stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Refresh token revoked or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/external-sync-runs/{run_id}:
    get:
      summary: Get a sync run
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sync run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalSyncRun'
  /api/external-messages:
    get:
      summary: List external messages
      parameters:
        - in: query
          name: account_id
          required: false
          schema: { type: string }
        - in: query
          name: folder
          required: false
          schema: { type: string }
        - in: query
          name: limit
          required: false
          schema: { type: integer }
      responses:
        '200':
          description: External messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExternalMessage'
  /api/external-messages/{id}/action:
    post:
      summary: Apply an action to an external message
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalMessageActionInput'
      responses:
        '200':
          description: Action applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }

components:
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    ExternalImapAccount:
      type: object
      properties:
        id: { type: string }
        provider: { type: string }
        email: { type: string }
        auth_type: { type: string }
        status: { type: string }
        last_sync_at: { type: string, format: date-time }
        last_error: { type: string }

    CreateExternalAccountInput:
      type: object
      required: [provider, email, authType, imap]
      properties:
        provider: { type: string }
        email: { type: string }
        authType: { type: string }
        imap:
          type: object
          properties:
            host: { type: string }
            port: { type: integer }
            tls: { type: boolean }

    UpdateExternalAccountInput:
      type: object
      properties:
        provider: { type: string }
        email: { type: string }
        authType: { type: string }

    ImapTestResult:
      type: object
      properties:
        ok: { type: boolean }
        capabilities:
          type: array
          items: { type: string }
        error: { type: string }

    ExternalImapFolder:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }

    FolderMappingInput:
      type: object
      required: [role]
      properties:
        role: { type: string }

    ImapDiscoverResult:
      type: object
      properties:
        folders:
          type: array
          items:
            $ref: '#/components/schemas/ExternalImapFolder'

    ExternalSyncRun:
      type: object
      properties:
        id: { type: string }
        account_id: { type: string }
        status: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }

    ExternalSyncStatus:
      type: object
      properties:
        account_id: { type: string }
        status: { type: string }
        last_sync_at: { type: string, format: date-time }
        last_error: { type: string }

    ExternalMessage:
      type: object
      properties:
        id: { type: string }
        account_id: { type: string }
        account_type: { type: string }
        account_email: { type: string }
        folder: { type: string }
        subject: { type: string }
        from: { type: string }
        to: { type: string }
        date: { type: string, format: date-time }
        snippet: { type: string }

    ExternalMessageActionInput:
      type: object
      required: [action]
      properties:
        action: { type: string }

    OAuth2ProviderOption:
      type: object
      properties:
        value:
          type: string
          description: Provider key stored on the account
          example: gmail
        label:
          type: string
          description: Label shown in the account picker
          example: Gmail
        authorizationEndpoint: { type: string }
        tokenEndpoint: { type: string }
        scopes:
          type: array
          items: { type: string }

    OAuth2AuthorizationUrl:
      type: object
      properties:
        authorizationUrl: { type: string, format: uri }
        state: { type: string }
        provider: { type: string }

    OAuth2CallbackInput:
      type: object
      required: [accountId, authorizationCode, redirectUri]
      properties:
        accountId: { type: string }
        authorizationCode: { type: string }
        redirectUri: { type: string, format: uri }

    OAuth2TokenUpdateInput:
      type: object
      required: [accountId, accessToken]
      properties:
        accountId: { type: string }
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer }
        scopes:
          type: array
          items: { type: string }
