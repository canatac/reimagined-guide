services:
  # MongoDB
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGODB_DATABASE:-mailserver}
    volumes:
      - mongo_data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # DKIM Service (from studious-octo-rotary-phone repository)
  # Note: Ensure studious-octo-rotary-phone repository is checked out at ../studious-octo-rotary-phone
  dkim-service:
    build:
      context: ../studious-octo-rotary-phone
      dockerfile: Dockerfile
    container_name: dkim-service
    ports:
      - "3000:3000"
    volumes:
      - ./dkim:/app/dkim
    environment:
      - PORT=3000
      - SMTP_HOST=smtp-server
      - SMTP_PORT=8025
      - SMTP_SECURE=false
      - SMTP_USER=${SMTP_USERNAME}
      - SMTP_PASS=${SMTP_PASSWORD}
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
      - DKIM_DOMAINS=${DKIM_DOMAINS:-${DOMAIN_NAME:-localhost}}
      - KEY_SELECTOR=${KEY_SELECTOR:-default}
      - PRIVATE_KEY_PATH=dkim/dkim-private.pem
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const s=require('net').connect(3000,'127.0.0.1',()=>process.exit(0));s.on('error',()=>process.exit(1));\""]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    depends_on:
      - smtp-server

  # SMTP Server
  smtp-server:
    build: .
    container_name: smtp-server
    ports:
      - "25:25"      # Standard SMTP
      - "587:587"    # SMTP Submission (STARTTLS)
      - "8025:8025"  # Plain SMTP
      - "8465:8465"  # TLS SMTP
    volumes:
      - ./emails:/app/emails
      - ./certs:/app/certs
    environment:
      - SMTP_TLS_ADDR=${SMTP_TLS_ADDR}
      - SMTP_PLAIN_ADDR=${SMTP_PLAIN_ADDR}
      - SMTP_SUBMISSION_ADDR=${SMTP_SUBMISSION_ADDR:-0.0.0.0:587}
      - CERT_PATH=/app/certs/${CERT_PATH}
      - KEY_PATH=/app/certs/${KEY_PATH}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - MONGODB_USERNAME=${MONGODB_USERNAME}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD}
      - MONGODB_CLUSTER_URL=${MONGODB_CLUSTER_URL:-mongodb}
      - MONGODB_APP_NAME=${MONGODB_APP_NAME:-mailserver}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-mailserver}
      - USE_MONGODB=${USE_MONGODB:-true}
      - RUST_LOG=${RUST_LOG}
    command: ["smtp_server"]
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy

  # Email API Server
  email-api:
    build: .
    container_name: email-api
    ports:
      - "8000:8000"  # HTTP API
      - "8443:8443"  # HTTPS API
    volumes:
      - ./certs:/app/certs
    environment:
      - API_SERVER_ADDR=${API_SERVER_ADDR}
      - FULLCHAIN_PATH=/app/certs/${FULLCHAIN_PATH}
      - PRIVKEY_PATH=/app/certs/${PRIVKEY_PATH}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - RUST_LOG=${RUST_LOG}
      - DKIM_SERVICE_URL=${DKIM_SERVICE_URL:-http://dkim-service:3000/generate-dkim}
      - SMTP_MONITORING_ENABLED=${SMTP_MONITORING_ENABLED:-true}
      - SMTP_RELAY_HOST=${SMTP_RELAY_HOST}
      - SMTP_RELAY_PORT=${SMTP_RELAY_PORT:-587}
      - SMTP_RELAY_USER=${SMTP_RELAY_USER}
      - SMTP_RELAY_PASSWORD=${SMTP_RELAY_PASSWORD}
      - MONGODB_USERNAME=${MONGODB_USERNAME}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD}
      - MONGODB_CLUSTER_URL=${MONGODB_CLUSTER_URL:-mongodb}
      - MONGODB_APP_NAME=${MONGODB_APP_NAME:-mailserver}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-mailserver}
      - USE_MONGODB=${USE_MONGODB:-true}
    command: ["email_api"]
    restart: unless-stopped
    depends_on:
      smtp-server:
        condition: service_started
      mongodb:
        condition: service_healthy
      dkim-service:
        condition: service_healthy

  # IMAP Server
  imap-server:
    build: .
    container_name: imap-server
    ports:
      - "143:143"    # IMAP
      - "993:993"    # IMAPS
      - "8080:8080"  # IMAP API
    volumes:
      - ./emails:/app/emails
    environment:
      - IMAP_SERVER=${IMAP_SERVER}
      - IMAP_SERVER_API_PORT=${IMAP_SERVER_API_PORT}
      - MONGODB_USERNAME=${MONGODB_USERNAME}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD}
      - MONGODB_CLUSTER_URL=${MONGODB_CLUSTER_URL:-mongodb}
      - MONGODB_APP_NAME=${MONGODB_APP_NAME:-mailserver}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-mailserver}
      - USE_MONGODB=${USE_MONGODB:-true}
      - RUST_LOG=${RUST_LOG}
    command: ["imap_server"]
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  emails:      # Local email storage
  mongo_data:  # MongoDB data persistence