name: CodeQL Security Scan

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: rust

      - name: Build for CodeQL
        run: cargo check --lib --bins --verbose

      - name: Analyze CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:rust"

      - name: Fail only on new alerts (PR)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          REPO: ${{ github.repository }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          set -euo pipefail
          if [ "${IS_FORK}" = "true" ]; then
            echo "::warning::Fork PR - skipping alert check."
            exit 0
          fi
          EXISTING_FILE=$(mktemp)
          if ! gh api "repos/${REPO}/code-scanning/alerts?state=open&ref=master" \
            --jq '.[].rule.id' > "$EXISTING_FILE" 2>/tmp/gh_err_master; then
            echo "::warning::Cannot fetch master baseline - skipping."
            rm -f "$EXISTING_FILE"
            exit 0
          fi
          PR_REF="refs/pull/${PR_NUMBER}/merge"
          CURRENT_FILE=$(mktemp)
          if ! gh api "repos/${REPO}/code-scanning/alerts?state=open&ref=${PR_REF}" \
            --jq '.[].rule.id' > "$CURRENT_FILE" 2>/tmp/gh_err_pr; then
            echo "::warning::Cannot fetch PR alerts - skipping."
            rm -f "$EXISTING_FILE" "$CURRENT_FILE"
            exit 0
          fi
          sort -u "$EXISTING_FILE" -o "$EXISTING_FILE"
          sort -u "$CURRENT_FILE" -o "$CURRENT_FILE"
          NEW_ALERTS=$(comm -13 "$EXISTING_FILE" "$CURRENT_FILE" || true)
          rm -f "$EXISTING_FILE" "$CURRENT_FILE" /tmp/gh_err_master /tmp/gh_err_pr
          if [ -n "$NEW_ALERTS" ]; then
            echo "::error::NEW CodeQL alerts: $NEW_ALERTS"
            exit 1
          fi
          echo "PASS: No new CodeQL alerts."
