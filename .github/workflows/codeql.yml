name: CodeQL Security Scan

on:
  pull_request:
    branches: [master]
  # NOTE: push master INTENTIONALLY DISABLED
  # This workflow runs on PRs only, never on push to master.
  # Reason: master may carry pre-existing alerts that would block
  # the main branch permanently. Only PRs are gated.

# -----------------------------------------------------------------
# FORK PRs: GITHUB_TOKEN is READ-ONLY on pull requests from forks.
# This means `gh api` cannot read code-scanning alerts for fork PRs.
# In that case this step is skipped (see the fork guard below).
# -----------------------------------------------------------------

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: rust
          queries: security-extended

      - name: Build for CodeQL
        run: cargo check --lib --bins --verbose

      - name: Upload SARIF results
        id: analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:rust"
          output: sarif-results
          upload: true

      - name: Fail only on new alerts (PR)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          REPO: ${{ github.repository }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          set -euo pipefail

          # Fork guard: GITHUB_TOKEN is read-only, cannot query alerts.
          if [ "${IS_FORK}" = "true" ]; then
            echo "::warning::Fork PR detected — GITHUB_TOKEN is read-only."
            echo "::warning::Cannot query code-scanning alerts for fork."
            echo "::warning::Skipping new-alert check. Manual review required."
            exit 0
          fi

          # Fetch alerts from master (baseline)
          echo "=== Fetching CodeQL alerts from master ==="
          EXISTING_FILE=$(mktemp)
          if ! gh api "repos/${REPO}/code-scanning/alerts?state=open&ref=master" \
            --jq '.[].rule.id' > "$EXISTING_FILE" 2>/tmp/gh_err_master; then
            echo "::error::Failed to fetch master alerts (API unavailable or 403)."
            echo "::error::First 10 lines of error:"
            head -10 /tmp/gh_err_master || true
            echo ""
            echo "Cannot determine baseline. Failing closed."
            rm -f "$EXISTING_FILE"
            exit 1
          fi

          # Fetch alerts from PR
          echo "=== Fetching CodeQL alerts from PR ==="
          PR_REF="refs/pull/${PR_NUMBER}/merge"
          CURRENT_FILE=$(mktemp)
          if ! gh api "repos/${REPO}/code-scanning/alerts?state=open&ref=${PR_REF}" \
            --jq '.[].rule.id' > "$CURRENT_FILE" 2>/tmp/gh_err_pr; then
            echo "::error::Failed to fetch PR alerts (API unavailable or 403)."
            echo "::error::First 10 lines of error:"
            head -10 /tmp/gh_err_pr || true
            echo ""
            echo "Cannot determine PR alert state. Failing closed."
            rm -f "$EXISTING_FILE" "$CURRENT_FILE"
            exit 1
          fi

          # Sort for comm
          sort -u "$EXISTING_FILE" -o "$EXISTING_FILE"
          sort -u "$CURRENT_FILE" -o "$CURRENT_FILE"

          # Find new alerts (in PR but not on master)
          echo "=== Comparing alerts ==="
          NEW_ALERTS=$(comm -13 "$EXISTING_FILE" "$CURRENT_FILE" || true)

          # Cleanup
          rm -f "$EXISTING_FILE" "$CURRENT_FILE" /tmp/gh_err_master /tmp/gh_err_pr

          if [ -n "$NEW_ALERTS" ]; then
            echo ""
            echo "::error::NEW CodeQL alerts detected in this PR (not on master):"
            echo "$NEW_ALERTS"
            echo ""
            echo "These alerts were introduced by this PR and must be fixed."
            exit 1
          else
            echo ""
            echo "PASS: No new CodeQL alerts. Any failing alerts already exist on master."
            echo ""
          fi
