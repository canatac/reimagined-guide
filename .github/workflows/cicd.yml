name: CI/CD Pipeline for SMTP Rust (Scaleway)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SCW_REGION: fr-par
  REGISTRY_ENDPOINT: rg.fr-par.scw.cloud
  REGISTRY_NAMESPACE: ${{ secrets.REGISTRY_NAME }}
  VM_IP: ${{ secrets.VM_IP }}
  IMAGE_NAME: smtp-server

jobs:
  test:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      
      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Compile (tests mocked Mongo deferred)
        run: cargo check --lib --bins --verbose

  build:
    name: Build and push to Scaleway Registry
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install and configure Scaleway CLI
        uses: scaleway/action-scw@v0
        with:
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          save-config: true
          export-config: true

      - name: Login to Scaleway Container Registry
        run: scw registry login program=docker region=fr-par

      - name: Build and push image
        env:
          IMAGE_REPO: ${{ env.REGISTRY_ENDPOINT }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          docker build \
            -t "$IMAGE_REPO:${{ github.sha }}" \
            -t "$IMAGE_REPO:latest" \
            .
          docker push "$IMAGE_REPO:${{ github.sha }}"
          docker push "$IMAGE_REPO:latest"

  deploy:
    name: Deploy to VM
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VM_SSH_KEY }}
          known_hosts: ${{ secrets.VM_KNOWN_HOSTS }}
      
      - name: Install and configure Scaleway CLI
        uses: scaleway/action-scw@v0
        with:
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          save-config: true
          export-config: true

      - name: Login registry and get pull password
        id: reg
        run: |
          set -euo pipefail
          scw registry login program=docker region=fr-par
          # docker login on remote uses SCW secret key + nologin user (official pattern)
          echo "endpoint=${{ env.REGISTRY_ENDPOINT }}" >> "$GITHUB_OUTPUT"

      - name: Deploy to VM
        env:
          IMAGE: ${{ env.REGISTRY_ENDPOINT }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no ubuntu@${{ env.VM_IP }} bash -s <<EOF
          set -euo pipefail
          mkdir -p /home/ubuntu/smtp-data/emails
          echo "${{ secrets.SCW_SECRET_KEY }}" | docker login ${{ env.REGISTRY_ENDPOINT }} -u nologin --password-stdin
          docker pull "$IMAGE"
          docker stop smtp-server || true
          docker rm smtp-server || true
          docker run -d --name smtp-server --restart unless-stopped \
            -e USE_MONGODB=false \
            -e SMTP_PLAIN_ADDR=0.0.0.0:8025 \
            -e SMTP_TLS_ADDR=0.0.0.0:8465 \
            -e SMTP_USERNAME=admin \
            -e SMTP_PASSWORD=changeme \
            -e CERT_PATH=/app/localhost.crt \
            -e KEY_PATH=/app/localhost.key \
            -p 25:8025 -p 587:8465 -p 8025:8025 -p 8465:8465 \
            -v /home/ubuntu/smtp-data/emails:/app/emails \
            "$IMAGE" smtp_server
          docker ps --filter name=smtp-server
          EOF

  test-availability:
    name: Test Service Availability
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for container then test SMTP port 25
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            if echo QUIT | nc -w 3 ${{ env.VM_IP }} 25 2>/dev/null | head -1 | grep -Eiq '220|SMTP|ready'; then
              echo "SMTP banner OK"
              exit 0
            fi
            if nc -z -w 2 ${{ env.VM_IP }} 25 2>/dev/null; then
              echo "SMTP port open"
              exit 0
            fi
            echo "retry $i..."
            sleep 5
          done
          echo "SMTP not reachable on :25"
          exit 1

      - name: Test SMTP submission port 587
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if nc -z -w 2 ${{ env.VM_IP }} 587 2>/dev/null; then
              echo "587 open"
              exit 0
            fi
            sleep 5
          done
          exit 1
